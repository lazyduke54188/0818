<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocab Coach AI</title>
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #181818;
      --input-bg: #262626;
      --primary-orange: #ff7a00;
      --orange-hover: #e06b00;
      --text-white: #f5f5f5;
      --text-muted: #a0a0a0;
      --border-color: #333333;
      --user-msg-bg: #ff7a00;
      --bot-msg-bg: #262626;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-white);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Main Container with Sidebar support */
    .app-container {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Left Sidebar */
    .sidebar {
      width: var(--sidebar-width);
      height: 100%;
      background-color: #121212;
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: absolute;
      left: calc(-1 * var(--sidebar-width));
      top: 0;
      z-index: 100;
      transition: left 0.3s ease;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sidebar-header h3 {
      font-size: 14px;
      color: var(--primary-orange);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn-new-chat {
      background: var(--primary-orange);
      color: #000;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .history-item {
      padding: 10px 12px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-white);
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: border-color 0.2s;
    }

    .history-item:hover, .history-item.active {
      border-color: var(--primary-orange);
    }

    .history-item .title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: 1;
    }

    .history-item .btn-del {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 2px 6px;
      font-size: 12px;
    }

    .history-item .btn-del:hover {
      color: #ff6b6b;
    }

    /* Main Chat Layout */
    .chat-container {
      flex: 1;
      height: 100vh;
      background-color: var(--card-bg);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: margin-left 0.3s ease;
    }

    @media (min-width: 768px) {
      .sidebar.open + .chat-container {
        margin-left: var(--sidebar-width);
      }
    }

    /* Top Navigation Bar */
    .chat-header {
      background-color: #121212;
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      z-index: 10;
    }

    .icon-btn {
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 6px;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      background: var(--input-bg);
    }

    .avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background-color: var(--primary-orange);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .avatar:hover {
      transform: scale(1.05);
      background-color: var(--orange-hover);
    }

    .header-info {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .key-input {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--primary-orange);
      font-weight: bold;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
      flex: 1;
      transition: border-color 0.2s;
    }

    .key-input:focus {
      border-color: var(--primary-orange);
    }

    .key-input::placeholder {
      color: var(--text-muted);
      font-weight: normal;
    }

    /* Collapsible System Prompt Drawer */
    .prompt-drawer {
      background-color: #141414;
      border-bottom: 1px solid var(--border-color);
      padding: 0 16px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease-out, padding 0.3s ease-out;
    }

    .prompt-drawer.open {
      max-height: 200px;
      padding: 12px 16px;
    }

    .prompt-drawer label {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      color: var(--primary-orange);
      font-weight: bold;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .prompt-drawer textarea {
      width: 100%;
      height: 80px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
      resize: none;
      outline: none;
      font-family: inherit;
    }

    .prompt-drawer textarea:focus {
      border-color: var(--primary-orange);
    }

    /* Messages Area */
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background-color: var(--card-bg);
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
      border-radius: 12px;
    }

    .msg.bot {
      background-color: var(--bot-msg-bg);
      color: var(--text-white);
      align-self: flex-start;
      border: 1px solid var(--border-color);
      border-bottom-left-radius: 2px;
    }

    .msg.user {
      background-color: var(--user-msg-bg);
      color: #000;
      font-weight: 500;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }

    .msg.sys {
      align-self: center;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      text-align: center;
      border: 1px dashed var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .msg.err {
      align-self: center;
      background: #2a0808;
      color: #ff6b6b;
      border: 1px solid #5a1818;
      font-size: 12px;
      text-align: center;
    }

    .speak-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 14px;
      margin-left: 8px;
      color: var(--primary-orange);
      vertical-align: middle;
    }

    /* Controls & Input Area */
    .controls-area {
      display: flex;
      justify-content: center;
      padding: 8px 16px 0;
      background-color: var(--card-bg);
    }

    .btn-start {
      background-color: transparent;
      border: 1px solid var(--primary-orange);
      color: var(--primary-orange);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      max-width: 400px;
    }

    .btn-start:hover {
      background-color: var(--primary-orange);
      color: #000;
    }

    .btn-start.hidden {
      display: none;
    }

    .chat-input-area {
      display: flex;
      gap: 10px;
      padding: 12px 16px;
      background-color: #121212;
      border-top: 1px solid var(--border-color);
    }

    .chat-input-area input {
      flex: 1;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-white);
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
    }

    .chat-input-area input:focus {
      border-color: var(--primary-orange);
    }

    .btn-send {
      background-color: var(--primary-orange);
      color: #000;
      border: none;
      border-radius: 20px;
      padding: 0 20px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-send:hover {
      background-color: var(--orange-hover);
    }

    .btn-send:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Left History Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3>History</h3>
      <button class="btn-new-chat" id="newChatBtn">+ New</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <!-- Main Chat Container -->
  <div class="chat-container">
    <!-- Top Navigation Bar -->
    <div class="chat-header">
      <button class="icon-btn" id="historyToggleBtn" title="Toggle Chat History">📜</button>
      <div class="avatar" id="avatar" title="Click to toggle Bot System Prompt Settings">🤖</div>
      <div class="header-info">
        <input id="key" type="password" class="key-input" placeholder="Paste Gemini API Key here (AQ...)" autocomplete="off">
        <button class="icon-btn" id="saveBtn" title="Save Chat Session">💾</button>
      </div>
    </div>

    <!-- Collapsible System Prompt Drawer -->
    <div class="prompt-drawer" id="drawer">
      <label for="sys">Bot System Prompt</label>
      <textarea id="sys">Role: You are an English vocabulary coach teaching native speakers or advanced learners.
Output Rules:
1. Always present vocabulary strictly in this 3-part format: Word | English Explanation | Example Sentence.
2. Teach one word at a time.
3. Keep all responses, explanations, feedback, and interaction 100% in ENGLISH. No other languages.
4. Encourage the user to write their own sentence using the word.
5. At the very end of your response, output a single line starting with "🔈" containing only the word and the example sentence separated by "|", like this:
🔈 abandon | Do not abandon your goals.</textarea>
    </div>

    <!-- Message History Area -->
    <div class="chat-messages" id="msgs">
      <div class="msg sys">Enter your API Key above and click "Start the first lesson" below to begin.</div>
    </div>

    <!-- One-time Action Button -->
    <div class="controls-area">
      <button class="btn-start" id="startBtn">Start the first lesson</button>
    </div>

    <!-- Input Field -->
    <div class="chat-input-area">
      <input id="text" type="text" placeholder="Type your sentence or answer..." autocomplete="off">
      <button class="btn-send" id="sendBtn">Send</button>
    </div>
  </div>
</div>

<script>
  const MODEL = 'gemini-3.6-flash';
  let history = [];
  let currentChatId = null;

  const $ = id => document.getElementById(id);
  const keyEl = $('key'),
        sysEl = $('sys'),
        msgs = $('msgs'),
        textEl = $('text'),
        sendBtn = $('sendBtn'),
        startBtn = $('startBtn'),
        avatar = $('avatar'),
        drawer = $('drawer'),
        saveBtn = $('saveBtn'),
        historyToggleBtn = $('historyToggleBtn'),
        sidebar = $('sidebar'),
        historyList = $('historyList'),
        newChatBtn = $('newChatBtn');

  // Toggle Sidebar & System Prompt Drawer
  historyToggleBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
  avatar.addEventListener('click', () => drawer.classList.toggle('open'));

  // Speech Synthesis
  let voices = [];
  function loadVoices() {
    if ('speechSynthesis' in window) voices = speechSynthesis.getVoices();
  }
  loadVoices();
  if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function parseTTS(text) {
    const m = text.match(/^[ \t]*🔈[ \t]*(.+?)[ \t]*$/m);
    if (m) {
      const say = m[1].replace(/\s*\|\s*/g, '. ').trim();
      const display = text.replace(m[0], '').replace(/\n{3,}/g, '\n\n').trim();
      return { display, say };
    }
    return { display: text, say: text };
  }

  function speak(text) {
    if (!('speechSynthesis' in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.95;
    const v = voices.find(x => /en[-_]US/i.test(x.lang)) || voices.find(x => /^en/i.test(x.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }

  // Render Bubbles
  function appendBubble(role, text) {
    const d = document.createElement('div');
    d.className = 'msg ' + role;
    if (role === 'bot') {
      const { display, say } = parseTTS(text);
      const span = document.createElement('span');
      span.textContent = display;
      d.appendChild(span);

      if (say) {
        const btn = document.createElement('button');
        btn.className = 'speak-btn';
        btn.title = 'Listen to pronunciation';
        btn.textContent = '🔊';
        btn.addEventListener('click', () => speak(say));
        d.appendChild(btn);
      }
    } else {
      d.textContent = text;
    }
    msgs.appendChild(d);
    msgs.scrollTop = msgs.scrollHeight;
    return d;
  }

  // API Call
  async function sendMessage(userText) {
    const key = keyEl.value.replace(/\s+/g, '').replace(/^["']+|["']+$/g, '');
    if (!key) {
      appendBubble('err', 'Please enter your Gemini API key in the top title area.');
      return;
    }

    appendBubble('user', userText);
    history.push({ role: 'user', parts: [{ text: userText }] });
    textEl.value = '';
    sendBtn.disabled = true;

    const thinkingMsg = appendBubble('sys', 'Coach is thinking...');

    const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent`;
    const body = {
      system_instruction: { parts: [{ text: sysEl.value }] },
      contents: history
    };

    try {
      let res, data, attempt = 0;
      const maxTry = 3;
      while (true) {
        attempt++;
        res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-goog-api-key': key
          },
          body: JSON.stringify(body)
        });
        data = await res.json();
        if (res.ok) break;

        if ((res.status === 503 || res.status === 429) && attempt < maxTry) {
          thinkingMsg.textContent = `Server busy, retrying (${attempt}/${maxTry - 1})...`;
          await new Promise(r => setTimeout(r, 1500 * attempt));
          continue;
        }
        break;
      }

      thinkingMsg.remove();

      if (!res.ok) {
        const errDetail = (data && data.error && data.error.message) || ('HTTP ' + res.status);
        appendBubble('err', 'Error: ' + errDetail);
        history.pop();
        return;
      }

      const reply = (data.candidates?.[0]?.content?.parts || []).map(p => p.text).join('').trim() || '(No response received)';
      appendBubble('bot', reply);
      history.push({ role: 'model', parts: [{ text: reply }] });
    } catch (err) {
      thinkingMsg.remove();
      appendBubble('err', 'Network error: ' + err.message);
      history.pop();
    } finally {
      sendBtn.disabled = false;
      textEl.focus();
    }
  }

  // Storage & History Handlers
  function getSavedChats() {
    return JSON.parse(localStorage.getItem('vocab_chats') || '{}');
  }

  function saveChatSession() {
    if (history.length === 0) {
      alert('No conversation to save.');
      return;
    }
    const chats = getSavedChats();
    if (!currentChatId) {
      currentChatId = 'chat_' + Date.now();
    }

    // Auto generate title from first bot message or user prompt
    let title = 'Session ' + new Date().toLocaleDateString();
    const botFirstMsg = history.find(h => h.role === 'model');
    if (botFirstMsg) {
      const match = botFirstMsg.parts[0].text.match(/^([A-Za-z]+)\s*\|/);
      if (match) title = 'Word: ' + match[1];
    }

    chats[currentChatId] = {
      id: currentChatId,
      title: title,
      date: new Date().toLocaleString(),
      sysPrompt: sysEl.value,
      history: history
    };

    localStorage.setItem('vocab_chats', JSON.stringify(chats));
    renderHistoryList();
    alert('Conversation saved!');
  }

  function loadChatSession(id) {
    const chats = getSavedChats();
    const chat = chats[id];
    if (!chat) return;

    currentChatId = id;
    history = chat.history || [];
    sysEl.value = chat.sysPrompt || sysEl.value;

    msgs.innerHTML = '';
    startBtn.classList.add('hidden'); // Hide start btn for loaded chats

    history.forEach(item => {
      const role = item.role === 'model' ? 'bot' : 'user';
      appendBubble(role, item.parts[0].text);
    });

    renderHistoryList();
  }

  function deleteChatSession(id, e) {
    e.stopPropagation();
    const chats = getSavedChats();
    delete chats[id];
    localStorage.setItem('vocab_chats', JSON.stringify(chats));

    if (currentChatId === id) {
      resetToNewChat();
    } else {
      renderHistoryList();
    }
  }

  function resetToNewChat() {
    currentChatId = null;
    history = [];
    msgs.innerHTML = '<div class="msg sys">Enter your API Key above and click "Start the first lesson" below to begin.</div>';
    startBtn.classList.remove('hidden');
    renderHistoryList();
  }

  function renderHistoryList() {
    const chats = getSavedChats();
    historyList.innerHTML = '';

    Object.keys(chats).reverse().forEach(id => {
      const chat = chats[id];
      const item = document.createElement('div');
      item.className = 'history-item' + (id === currentChatId ? ' active' : '');
      
      const titleEl = document.createElement('span');
      titleEl.className = 'title';
      titleEl.textContent = chat.title;

      const delBtn = document.createElement('button');
      delBtn.className = 'btn-del';
      delBtn.textContent = '✕';
      delBtn.addEventListener('click', (e) => deleteChatSession(id, e));

      item.appendChild(titleEl);
      item.appendChild(delBtn);
      item.addEventListener('click', () => loadChatSession(id));

      historyList.appendChild(item);
    });
  }

  // Event Listeners
  sendBtn.addEventListener('click', () => {
    const t = textEl.value.trim();
    if (t) sendMessage(t);
  });

  textEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      const t = textEl.value.trim();
      if (t) sendMessage(t);
    }
  });

  startBtn.addEventListener('click', () => {
    startBtn.classList.add('hidden');
    sendMessage('I am ready. Please start the first lesson.');
  });

  saveBtn.addEventListener('click', saveChatSession);
  newChatBtn.addEventListener('click', resetToNewChat);

  // Initial Load
  renderHistoryList();
</script>

</body>
</html>
